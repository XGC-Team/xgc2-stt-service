name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - ".xgc2/**"
      - ".github/workflows/client-deb-ci.yml"
      - ".github/workflows/client-deb.yml"
      - ".github/workflows/review.yml"
      - ".gitignore"
      - "src/xgc2_stt/desktop.py"
      - "src/xgc2_stt/desktop_support.py"
      - "tests/test_desktop_support.py"
      - "tests/test_desktop_audio.py"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: stt-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  VERSION: 0.1.0
  IMAGE: ghcr.io/xgc-team/xgc2-stt-service

jobs:
  verify-registries:
    name: Verify registries
    runs-on: ubuntu-latest
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
    outputs:
      extra: ${{ steps.probe.outputs.extra }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: probe
        name: Resolve extra registry
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci-registry-roots.sh
          source scripts/ci-registry-roots.sh
          present=0
          for key in EXTRA_REGISTRY EXTRA_NAMESPACE EXTRA_USERNAME EXTRA_PASSWORD; do
            [ -n "${!key:-}" ] && present=$((present + 1))
          done
          if [ "${present}" -eq 4 ]; then
            echo "extra=1" >> "${GITHUB_OUTPUT}"
          elif [ "${present}" -eq 0 ]; then
            echo "extra=0" >> "${GITHUB_OUTPUT}"
          else
            echo "extra registry is partially configured" >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        if: steps.probe.outputs.extra == '1'
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}
      - name: Probe extra registry
        if: steps.probe.outputs.extra == '1'
        run: |
          set -euo pipefail
          # docker login already completed the Bearer token dance. Harbor-style
          # registries still return 401 for Basic on /v2/; treat that as reachable.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "${EXTRA_USERNAME}:${EXTRA_PASSWORD}" "https://${EXTRA_REGISTRY}/v2/" || true)"
          case "${code}" in
            200|401) echo "extra registry /v2/ returned ${code}" ;;
            *) echo "extra registry /v2/ returned ${code}" >&2; exit 1 ;;
          esac

  checks:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install desktop test runtime
        run: |
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0 libportaudio2 \
            libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxext6 libxkbcommon-x11-0 libxkbcommon0 libzstd1 \
            xauth xvfb

      - name: Run source gates
        run: |
          uv sync --frozen --extra dev --extra desktop
          uv run ruff check src tests scripts/verify-stream.py
          xvfb-run -a uv run pytest
          npm --prefix web ci
          npm --prefix web run test
          npm --prefix web run typecheck
          npm --prefix web run build
          docker compose config >/dev/null
          STT_VARIANT=qwen docker compose -f docker-compose.yml -f docker-compose.build.yml config >/dev/null
          bash -n scripts/*.sh

  base:
    name: Build common base
    needs: [checks, verify-registries]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free runner space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push common base
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          build-args: APP_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:base-${{ env.VERSION }}
            ${{ env.IMAGE }}:base
            ${{ env.IMAGE }}:base-sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:base-${{ env.VERSION }}
          cache-to: type=inline
          provenance: mode=max
          sbom: true

  variants:
    name: Build ${{ matrix.variant }}
    needs: [base, verify-registries]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [qwen]
    steps:
      - uses: actions/checkout@v4

      - name: Free runner space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          {
            echo 'value<<EOF'
            echo "${IMAGE}:${VARIANT}-${VERSION}"
            echo "${IMAGE}:${VARIANT}"
            echo "${IMAGE}:${VARIANT}-sha-${GITHUB_SHA}"
            if [ "${VARIANT}" = qwen ]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push embedded ${{ matrix.variant }} variant
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          build-args: APP_VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:base-${{ env.VERSION }}
            type=registry,ref=${{ env.IMAGE }}:${{ matrix.variant }}-${{ env.VERSION }}
          cache-to: type=inline
          provenance: mode=max
          sbom: true

  mirror:
    name: Mirror release tags
    needs: [verify-registries, base, variants]
    if: needs.verify-registries.outputs.extra == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
      EXTRA_NAMESPACE: ${{ secrets.EXTRA_NAMESPACE }}
      EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
      EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.EXTRA_REGISTRY }}
          username: ${{ env.EXTRA_USERNAME }}
          password: ${{ env.EXTRA_PASSWORD }}
      - name: Mirror runnable images
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci-registry-roots.sh
          source scripts/ci-registry-roots.sh
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends skopeo >/dev/null
          target="${EXTRA_ROOT}/xgc2-stt-service"
          tags=(base base-${VERSION} qwen qwen-${VERSION} latest)
          for tag in "${tags[@]}"; do
            skopeo copy --override-os linux --override-arch amd64 \
              --authfile "${HOME}/.docker/config.json" \
              "docker://${IMAGE}:${tag}" "docker://${target}:${tag}"
          done
