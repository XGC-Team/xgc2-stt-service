name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: stt-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VERSION: 0.1.0
      IMAGE: ghcr.io/${{ github.repository }}
      XGC_CN_REGISTRY: ${{ secrets.XGC_CN_REGISTRY }}
      XGC_CN_NAMESPACE: ${{ secrets.XGC_CN_NAMESPACE }}
      XGC_CN_USERNAME: ${{ secrets.XGC_CN_USERNAME }}
      XGC_CN_PASSWORD: ${{ secrets.XGC_CN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Source checks
        run: |
          uv sync --frozen --extra dev
          uv run ruff check src tests scripts/verify-stream.py
          uv run pytest
          npm --prefix web ci
          npm --prefix web run test
          npm --prefix web run typecheck
          npm --prefix web run build
          docker compose config >/dev/null
          STT_VARIANT=qwen docker compose -f docker-compose.yml -f docker-compose.build.yml config >/dev/null
          STT_VARIANT=voxtral docker compose -f docker-compose.yml -f docker-compose.build.yml config >/dev/null
          bash -n scripts/*.sh

      - name: Free runner space for embedded-weight images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push common base
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          build-args: APP_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:base-${{ env.VERSION }}
            ${{ env.IMAGE }}:base
            ${{ env.IMAGE }}:base-sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and push embedded Qwen variant
        uses: docker/build-push-action@v6
        with:
          context: .
          target: qwen
          build-args: APP_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:qwen-${{ env.VERSION }}
            ${{ env.IMAGE }}:qwen
            ${{ env.IMAGE }}:qwen-sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and push embedded Voxtral variant
        uses: docker/build-push-action@v6
        with:
          context: .
          target: voxtral
          build-args: APP_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:voxtral-${{ env.VERSION }}
            ${{ env.IMAGE }}:voxtral
            ${{ env.IMAGE }}:voxtral-sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          provenance: mode=max
          sbom: true

      - name: Mirror release tags to China registry when configured
        shell: bash
        run: |
          set -euo pipefail
          values=(XGC_CN_REGISTRY XGC_CN_NAMESPACE XGC_CN_USERNAME XGC_CN_PASSWORD)
          present=0
          for name in "${values[@]}"; do
            [ -n "${!name:-}" ] && present=$((present + 1))
          done
          if [ "${present}" -eq 0 ]; then
            echo "China registry mirror not configured"
            exit 0
          fi
          if [ "${present}" -ne 4 ]; then
            echo "China registry mirror is partially configured" >&2
            exit 1
          fi
          printf '%s' "${XGC_CN_PASSWORD}" | docker login "${XGC_CN_REGISTRY}" \
            --username "${XGC_CN_USERNAME}" --password-stdin >/dev/null
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends skopeo >/dev/null
          target="${XGC_CN_REGISTRY%/}/${XGC_CN_NAMESPACE#/}/xgc2-stt-service"
          target="${target//\/\//\/}"
          tags=(base base-${VERSION} qwen qwen-${VERSION} voxtral voxtral-${VERSION} latest)
          for tag in "${tags[@]}"; do
            skopeo copy --all --authfile "${HOME}/.docker/config.json" \
              "docker://${IMAGE}:${tag}" "docker://${target}:${tag}"
          done
