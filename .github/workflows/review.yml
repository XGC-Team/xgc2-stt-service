name: Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stt-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Source, WebUI, and shell checks
        run: |
          export PATH="/usr/local/bin:/usr/local/go/bin:/usr/local/cargo/bin:${PATH}"
          uv sync --frozen --extra dev --extra desktop
          uv run ruff check src tests scripts/verify-stream.py
          env -u DISPLAY -u WAYLAND_DISPLAY uv run pytest
          npm --prefix web ci
          npm --prefix web run test
          npm --prefix web run typecheck
          npm --prefix web run build
          bash -n scripts/*.sh
          ./.xgc2/scripts/check_client_package.sh

  review-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose config
        run: |
          docker compose config >/dev/null
          STT_VARIANT=qwen docker compose -f docker-compose.yml -f docker-compose.build.yml config >/dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Validate all Docker targets without downloading weights
        run: |
          docker buildx build --call=check --target base .
          docker buildx build --call=check --target qwen .
