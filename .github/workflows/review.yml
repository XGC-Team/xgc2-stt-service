name: Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stt-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install desktop test runtime
        run: sudo apt-get install -y --no-install-recommends libportaudio2

      - name: Source, WebUI, Compose, and shell checks
        run: |
          uv sync --frozen --extra dev --extra desktop
          uv run ruff check src tests scripts/verify-stream.py
          uv run pytest
          npm --prefix web ci
          npm --prefix web run test
          npm --prefix web run typecheck
          npm --prefix web run build
          docker compose config >/dev/null
          STT_VARIANT=qwen docker compose -f docker-compose.yml -f docker-compose.build.yml config >/dev/null
          STT_VARIANT=voxtral docker compose -f docker-compose.yml -f docker-compose.build.yml config >/dev/null
          bash -n scripts/*.sh
          ./.xgc2/scripts/check_client_package.sh

      - uses: docker/setup-buildx-action@v3

      - name: Validate all Docker targets without downloading weights
        run: |
          docker buildx build --call=check --target base .
          docker buildx build --call=check --target qwen .
          docker buildx build --call=check --target voxtral .
