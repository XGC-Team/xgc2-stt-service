name: Desktop client Deb release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      prepare_action:
        description: Release-train action
        required: false
        default: release
        type: choice
        options: [release, compatibility-verify]
      apt_overlay_url:
        description: Unused. Debs are published to GitHub Releases.
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of the resolved release-train dependency set
        required: false
        default: ""
        type: string
permissions:
  actions: read
  contents: read

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}

jobs:
  release-guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release contract
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PREPARE_ACTION: ${{ inputs.prepare_action || 'release' }}
        run: |
          set -euo pipefail
          version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$source_sha" == "$EXPECTED_SOURCE_SHA" ]]
            [[ "$version" == "$EXPECTED_VERSION" ]]
            case "$PREPARE_ACTION" in release|compatibility-verify) ;; *) exit 1 ;; esac
          fi
          if [[ -n "${XGC2_DEPENDENCY_SET_DIGEST}" && ! "$XGC2_DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "dependency_set_digest must be empty or 64 lowercase hex characters" >&2
            exit 1
          fi
          if [[ -n "${XGC2_APT_OVERLAY_URL}" && -z "$XGC2_DEPENDENCY_SET_DIGEST" ]]; then
            echo "apt_overlay_url requires dependency_set_digest" >&2
            exit 1
          fi
          ./.xgc2/scripts/check_client_package.sh
          if [[ "$PREPARE_ACTION" == release ]]; then
            tag="desktop-v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1 || \
               gh release view "${tag}" >/dev/null 2>&1; then
              echo "Release namespace already exists: ${tag}" >&2
              exit 1
            fi
          fi
          {
            echo "version=${version}"
            echo "source_sha=${source_sha}"
            if [[ "$PREPARE_ACTION" == release ]]; then
              echo "publish=true"
            else
              echo "publish=false"
            fi
          } >> "$GITHUB_OUTPUT"

  source-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Run desktop source tests
        run: |
          uv sync --frozen --extra dev --extra desktop
          uv run ruff check src tests
          uv run pytest
          ./.xgc2/scripts/check_client_package.sh

  build-and-smoke:
    needs: [release-guard, source-tests]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            distribution: focal
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            distribution: jammy
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            distribution: noble
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            distribution: focal
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            distribution: jammy
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            distribution: noble
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.distribution }} Deb
        env:
          XGC2_CLIENT_BUILD_IMAGE: ${{ matrix.build_image }}
        run: |
          ./.xgc2/scripts/build_client_deb_in_docker.sh \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.architecture }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"
      - name: Smoke-test installed package on ${{ matrix.distribution }}
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -e TARGET_ARCH="${{ matrix.architecture }}" \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work ${{ matrix.build_image }} bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get -o Acquire::Retries=5 update >/dev/null
              apt-get install -y --no-install-recommends ./debs/xgc2-stt-client_*.deb >/dev/null
              ./.xgc2/scripts/smoke_client_deb.sh ./debs/xgc2-stt-client_*.deb
            '
      - name: Create release-train build manifest
        run: |
          install -d .ci/build-manifests
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-stt-client \
            --product-version "${{ needs.release-guard.outputs.version }}" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.architecture }}" \
            --source-sha "${{ needs.release-guard.outputs.source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - uses: actions/upload-artifact@v4
        if: ${{ needs.release-guard.outputs.publish == 'true' }}
        with:
          name: xgc2-stt-client-${{ matrix.distribution }}-${{ matrix.architecture }}-release-input
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

  publish-github-release:
    if: ${{ needs.release-guard.outputs.publish == 'true' }}
    needs: [release-guard, build-and-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xgc2-stt-client-*-release-input
          path: dist
          merge-multiple: true
      - name: Publish Debs to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-guard.outputs.version }}
          SOURCE_SHA: ${{ needs.release-guard.outputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t debs < <(find dist -type f -name '*.deb' | LC_ALL=C sort)
          [[ ${#debs[@]} -ge 6 ]] || {
            echo "Expected Ubuntu 20.04/22.04/24.04 amd64/arm64 Debs, found ${#debs[@]}" >&2
            find dist -type f >&2
            exit 1
          }
          tag="desktop-v${VERSION}"
          notes="$(mktemp)"
          cat >"${notes}" <<EOF
          Desktop client ${VERSION} for Ubuntu 20.04 (focal), 22.04 (jammy), and 24.04 (noble).

          Download the \`.deb\` that matches your Ubuntu release and architecture, then:

          \`\`\`bash
          sudo dpkg -i xgc2-stt-client_${VERSION}_amd64.ubuntu-22.04.deb
          sudo apt-get install -f
          xgc2-stt-client
          \`\`\`

          This leaf workflow publishes GitHub Release assets only. APT
          promotion is owned by the central release train. The package does
          not bundle a service URL or API key.
          Source commit: ${SOURCE_SHA}
          EOF
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1 || \
             gh release view "${tag}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release namespace: ${tag}" >&2
            exit 1
          fi
          gh release create "${tag}" "${debs[@]}" \
            --title "Desktop client ${VERSION}" \
            --notes-file "${notes}" \
            --target "${SOURCE_SHA}"
