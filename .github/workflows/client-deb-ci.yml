name: Desktop client Deb CI

on:
  push:
    branches: [main]
    paths:
      - ".xgc2/**"
      - ".github/workflows/client-deb-ci.yml"
      - ".github/workflows/client-deb.yml"
      - ".github/workflows/review.yml"
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "pyproject.toml"
      - "uv.lock"
      - "src/xgc2_stt/__init__.py"
      - "src/xgc2_stt/desktop.py"
      - "src/xgc2_stt/desktop_audio.py"
      - "src/xgc2_stt/desktop_cli.py"
      - "src/xgc2_stt/desktop_support.py"
      - "tests/test_desktop_support.py"
      - "tests/test_desktop_audio.py"
      - "tests/test_desktop_cli.py"
      - "tests/test_client_privacy_gate.py"
  pull_request:
    branches: [main]
    paths:
      - ".xgc2/**"
      - ".github/workflows/client-deb-ci.yml"
      - ".github/workflows/client-deb.yml"
      - ".github/workflows/review.yml"
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "pyproject.toml"
      - "uv.lock"
      - "src/xgc2_stt/__init__.py"
      - "src/xgc2_stt/desktop.py"
      - "src/xgc2_stt/desktop_audio.py"
      - "src/xgc2_stt/desktop_cli.py"
      - "src/xgc2_stt/desktop_support.py"
      - "tests/test_desktop_support.py"
      - "tests/test_desktop_audio.py"
      - "tests/test_desktop_cli.py"
      - "tests/test_client_privacy_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stt-client-deb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: ubuntu-latest
    container:
      image: ${{ format('{0}/{1}/xgc2-build-noble-dev:1.0.0', replace(replace(secrets.EXTRA_REGISTRY, 'https://', ''), 'http://', ''), vars.EXTRA_NAMESPACE) }}
      credentials:
        username: ${{ secrets.EXTRA_USERNAME }}
        password: ${{ secrets.EXTRA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Run mandatory source and package gates
        run: |
          uv sync --frozen --extra dev --extra desktop
          uv run ruff check src tests
          uv run pytest
          ./.xgc2/scripts/check_client_package.sh

  build-and-smoke:
    needs: source-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            distribution: focal
            image_name: xgc2-build-focal-dev:1.0.0
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            distribution: jammy
            image_name: xgc2-build-jammy-dev:1.0.0
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            distribution: noble
            image_name: xgc2-build-noble-dev:1.0.0
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            distribution: focal
            image_name: xgc2-build-focal-dev:1.0.0
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            distribution: jammy
            image_name: xgc2-build-jammy-dev:1.0.0
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            distribution: noble
            image_name: xgc2-build-noble-dev:1.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Login to extra image registry
        env:
          EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
          EXTRA_USERNAME: ${{ secrets.EXTRA_USERNAME }}
          EXTRA_PASSWORD: ${{ secrets.EXTRA_PASSWORD }}
        run: ./.xgc2/scripts/extra_registry_login.sh
      - name: Build ${{ matrix.distribution }} Deb
        env:
          EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
          EXTRA_NAMESPACE: ${{ vars.EXTRA_NAMESPACE }}
        run: |
          export XGC2_CLIENT_BUILD_IMAGE="$(./.xgc2/scripts/extra_build_image.sh "${{ matrix.image_name }}")"
          ./.xgc2/scripts/build_client_deb_in_docker.sh \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.architecture }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"
      - name: Smoke-test installed package on ${{ matrix.distribution }}
        env:
          EXTRA_REGISTRY: ${{ secrets.EXTRA_REGISTRY }}
          EXTRA_NAMESPACE: ${{ vars.EXTRA_NAMESPACE }}
        run: |
          image="$(./.xgc2/scripts/extra_build_image.sh "${{ matrix.image_name }}")"
          docker run --rm --platform "${{ matrix.platform }}" \
            -e TARGET_ARCH="${{ matrix.architecture }}" \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work "${image}" bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get -o Acquire::Retries=5 update >/dev/null
              apt-get install -y --no-install-recommends ./debs/xgc2-stt-client_*.deb >/dev/null
              ./.xgc2/scripts/smoke_client_deb.sh ./debs/xgc2-stt-client_*.deb
            '
      - name: Create trusted build manifest
        run: |
          install -d .ci/build-manifests
          version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-stt-client \
            --product-version "$version" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.architecture }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: xgc2-stt-client-${{ matrix.distribution }}-${{ matrix.architecture }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
