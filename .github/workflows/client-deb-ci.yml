name: Desktop client Deb CI
# Dependencies come from xgc2-images. Do not apt-get / pip / uv sync / npm ci.

on:
  push:
    branches: [main]
    paths:
      - ".xgc2/**"
      - ".github/workflows/client-deb-ci.yml"
      - ".github/workflows/client-deb.yml"
      - ".github/workflows/review.yml"
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "pyproject.toml"
      - "uv.lock"
      - "src/xgc2_stt/__init__.py"
      - "src/xgc2_stt/desktop.py"
      - "src/xgc2_stt/desktop_audio.py"
      - "src/xgc2_stt/desktop_cli.py"
      - "src/xgc2_stt/desktop_support.py"
      - "src/xgc2_stt/engine.py"
      - "tests/test_desktop_support.py"
      - "tests/test_desktop_audio.py"
      - "tests/test_desktop_cli.py"
      - "tests/test_engine.py"
      - "tests/test_artifact_manifest.py"
      - "tests/test_docker_image_workflow_contract.py"
      - "tests/test_client_privacy_gate.py"
  pull_request:
    branches: [main]
    paths:
      - ".xgc2/**"
      - ".github/workflows/client-deb-ci.yml"
      - ".github/workflows/client-deb.yml"
      - ".github/workflows/review.yml"
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "pyproject.toml"
      - "uv.lock"
      - "src/xgc2_stt/__init__.py"
      - "src/xgc2_stt/desktop.py"
      - "src/xgc2_stt/desktop_audio.py"
      - "src/xgc2_stt/desktop_cli.py"
      - "src/xgc2_stt/desktop_support.py"
      - "src/xgc2_stt/engine.py"
      - "tests/test_desktop_support.py"
      - "tests/test_desktop_audio.py"
      - "tests/test_desktop_cli.py"
      - "tests/test_engine.py"
      - "tests/test_artifact_manifest.py"
      - "tests/test_docker_image_workflow_contract.py"
      - "tests/test_client_privacy_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stt-client-deb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xgc-team/xgc2-images/xgc2-stt-dev:1.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Run mandatory source and package gates
        run: |
          export PATH="/usr/local/bin:/usr/local/go/bin:/usr/local/cargo/bin:${PATH}"
          export PYTHONPATH="${GITHUB_WORKSPACE}/src${PYTHONPATH:+:${PYTHONPATH}}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          ruff check src tests
          pytest
          ./.xgc2/scripts/check_client_package.sh

  build-and-smoke:
    needs: source-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            distribution: focal
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
            smoke_image: ghcr.io/xgc-team/xgc2-images/xgc2-stt-client-focal:1.0.0
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            distribution: jammy
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
            smoke_image: ghcr.io/xgc-team/xgc2-images/xgc2-stt-client-jammy:1.0.0
          - architecture: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            distribution: noble
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
            smoke_image: ghcr.io/xgc-team/xgc2-images/xgc2-stt-dev:1.0.0
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            distribution: focal
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
            smoke_image: ghcr.io/xgc-team/xgc2-images/xgc2-stt-client-focal:1.0.0
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            distribution: jammy
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-jammy-dev:1.0.0
            smoke_image: ghcr.io/xgc-team/xgc2-images/xgc2-stt-client-jammy:1.0.0
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            distribution: noble
            build_image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
            smoke_image: ghcr.io/xgc-team/xgc2-images/xgc2-stt-dev:1.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.distribution }} Deb
        env:
          XGC2_CLIENT_BUILD_IMAGE: ${{ matrix.build_image }}
        run: |
          ./.xgc2/scripts/build_client_deb_in_docker.sh \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.architecture }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"
      - name: Smoke-test installed package on ${{ matrix.distribution }}
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -e TARGET_ARCH="${{ matrix.architecture }}" \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work ${{ matrix.smoke_image }} bash -lc '
              set -euo pipefail
              dpkg -i ./debs/xgc2-stt-client_*.deb
              ./.xgc2/scripts/smoke_client_deb.sh ./debs/xgc2-stt-client_*.deb
            '
      - name: Create trusted build manifest
        run: |
          install -d .ci/build-manifests
          version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          deb_version="${version}~${{ matrix.distribution }}"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-stt-client \
            --product-version "$version" \
            --deb-version "$deb_version" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.architecture }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: xgc2-stt-client-${{ matrix.distribution }}-${{ matrix.architecture }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
