services:
  stt:
    image: ${STT_IMAGE:-ghcr.io/lxk36/xgc2-stt-service:voxtral-0.1.0}
    container_name: xgc2-stt-service
    restart: unless-stopped
    gpus: ${NVIDIA_VISIBLE_DEVICES:-all}
    ports:
      - "${STT_WEB_BIND_ADDRESS:-127.0.0.1}:${STT_WEB_PORT:-34896}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      STT_GPU_MEMORY_UTILIZATION: ${STT_GPU_MEMORY_UTILIZATION:-0.80}
    volumes:
      - xgc2-stt-cache:/var/lib/xgc2-stt
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    shm_size: 8gb
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10m

  api:
    image: ${STT_IMAGE:-ghcr.io/lxk36/xgc2-stt-service:voxtral-0.1.0}
    container_name: xgc2-stt-api
    restart: unless-stopped
    depends_on:
      stt:
        condition: service_healthy
    command: ["uvicorn", "xgc2_stt.api_proxy:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "${STT_API_BIND_ADDRESS:-0.0.0.0}:${STT_API_PORT:-34897}:8002"
    environment:
      STT_UPSTREAM_HTTP_URL: http://stt:8000
      STT_UPSTREAM_WEBSOCKET_URL: ws://stt:8000
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  xgc2-stt-cache:
    name: xgc2-stt-cache
