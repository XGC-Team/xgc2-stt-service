schema: xgc2.product.v1
id: xgc2-stt-client
name: XGC2 STT Desktop Client
version: 0.2.1-3
kind: desktop-deb
summary: Tray client for a user-supplied XGC2-compatible streaming STT API.
groups:
- desktop
- audio
apt:
  distribution: focal,jammy,noble
  install:
  - xgc2-stt-client
  packages:
  - xgc2-stt-client
  package_architectures:
    xgc2-stt-client:
    - amd64
    - arm64
  package_distributions:
    xgc2-stt-client:
    - focal
    - jammy
    - noble
  depends:
  - wl-clipboard
  - xclip
  - xdotool
usage:
  install: 'Download the Ubuntu matching .deb from GitHub Releases, then:

    sudo apt install ./xgc2-stt-client_0.2.1-3_amd64.ubuntu-22.04.deb

    '
  smoke_test: 'dpkg-query -W xgc2-stt-client

    xgc2-stt-client --version

    '
  notes: The package contains no service URL, API key, private registry, or network port.
    On first launch, the user supplies an endpoint operated by themselves or their organization.
    Autostart is a Settings option and is not enabled by package installation. Debs are
    published on GitHub Releases, not through an APT repository.
ownership:
  paths:
  - /usr/bin/xgc2-stt-client
  - /usr/lib/python3/dist-packages/xgc2_stt
  - /usr/share/applications/xgc2-stt-client.desktop
  - /usr/share/metainfo/io.xgc2.stt-client.metainfo.xml
release:
  repository: XGC-Team/xgc2-stt-service
  ref: main
  workflow: client-deb.yml
  ci_workflow: client-deb-ci.yml
  apt_versions:
    focal: 0.2.1-3
    jammy: 0.2.1-3
    noble: 0.2.1-3
